name: Hook scripts tests

on:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/hooks-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run git_guard.py tests
        run: python3 -m unittest discover -s hooks/scripts/tests -v
