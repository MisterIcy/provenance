name: Hook scripts tests

on:
  pull_request:
    paths:
      - "hooks/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/hooks-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test
